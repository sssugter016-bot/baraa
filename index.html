<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEO CITY — Open World</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif}
  #game{position:fixed;inset:0;display:block}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;font-family:'Helvetica Neue',Arial,sans-serif}
  .panel{position:absolute;background:rgba(8,10,18,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 14px}

  /* top-left: stats */
  #stats{top:18px;left:18px;min-width:240px}
  .bar{height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-top:4px}
  .bar > i{display:block;height:100%;transition:width .2s ease}
  .bar.hp > i{background:linear-gradient(90deg,#ff3a55,#ff8a00)}
  .bar.armor > i{background:linear-gradient(90deg,#56e0ff,#5b8cff)}
  .label{font-size:10px;letter-spacing:.22em;color:#9aa3c4;text-transform:uppercase;display:flex;justify-content:space-between}
  .label b{color:#fff;font-weight:600;letter-spacing:.05em}

  /* top-right: money + wanted */
  #money{top:18px;right:18px;text-align:right;min-width:200px}
  #money .amount{font-size:26px;font-weight:700;letter-spacing:-.01em;color:#9cffb0;text-shadow:0 0 16px rgba(80,255,140,.35)}
  #wanted{margin-top:8px;font-size:18px;letter-spacing:.3em}
  #wanted span{opacity:.18;transition:opacity .25s}
  #wanted span.on{opacity:1;color:#ffd24a;text-shadow:0 0 10px #ffae00}

  /* bottom-left: weapon */
  #weapon{bottom:18px;left:18px;min-width:200px}
  #weapon .name{font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:#cfd5ec}
  #weapon .ammo{font-size:30px;font-weight:700;margin-top:2px}
  #weapon .ammo small{font-size:14px;color:#9aa3c4;font-weight:400;margin-left:4px}

  /* bottom-right: minimap */
  #minimap{bottom:18px;right:18px;width:200px;height:200px;padding:0;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.18)}
  #minimap canvas{display:block;width:100%;height:100%}
  #compass{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.4em;color:#fff;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:8px}

  /* center crosshair */
  #cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.85}
  #cross::before,#cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 4px #000}
  #cross::before{left:50%;top:0;bottom:0;width:1px;transform:translateX(-50%)}
  #cross::after{top:50%;left:0;right:0;height:1px;transform:translateY(-50%)}
  #cross.hidden{display:none}

  /* prompt */
  #prompt{position:absolute;left:50%;bottom:25%;transform:translateX(-50%);font-size:13px;letter-spacing:.2em;text-transform:uppercase;background:rgba(0,0,0,.6);padding:10px 18px;border-radius:6px;border:1px solid rgba(255,255,255,.15);opacity:0;transition:opacity .2s}
  #prompt.show{opacity:1}
  #prompt b{color:#ffd24a;margin-right:6px}

  /* notification */
  #notify{position:absolute;top:80px;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:.18em;text-transform:uppercase;background:rgba(0,0,0,.7);padding:10px 22px;border-radius:6px;border-left:3px solid #ffd24a;opacity:0;transition:opacity .3s}
  #notify.show{opacity:1}

  /* damage flash */
  #damage{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,30,30,.6) 100%);opacity:0;transition:opacity .15s}
  #damage.hit{opacity:1}

  /* ---------- start screen ---------- */
  #start{position:fixed;inset:0;background:radial-gradient(ellipse at center,#0a1130 0%,#000 70%);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20;text-align:center;padding:20px}
  #start h1{font-size:clamp(40px,9vw,108px);font-weight:900;letter-spacing:-.04em;line-height:.9;background:linear-gradient(180deg,#fff 0%,#ffae00 70%,#ff3a55 100%);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
  #start .sub{font-size:14px;letter-spacing:.5em;color:#ffae00;text-transform:uppercase;margin-bottom:40px}
  #start .keys{display:grid;grid-template-columns:auto auto;gap:8px 20px;font-size:13px;color:#cfd5ec;margin-bottom:36px;font-family:'JetBrains Mono',monospace}
  #start .keys b{color:#ffd24a;font-weight:600}
  #start button{padding:16px 50px;font-size:14px;letter-spacing:.3em;text-transform:uppercase;background:linear-gradient(135deg,#ff3a55,#ffae00);color:#000;border:none;border-radius:4px;cursor:pointer;font-weight:700;box-shadow:0 10px 40px rgba(255,80,80,.4);transition:transform .15s}
  #start button:hover{transform:translateY(-2px)}
  #start .tag{margin-top:30px;font-size:11px;letter-spacing:.4em;color:#5d6394;text-transform:uppercase}

  /* ---------- loading ---------- */
  #loading{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:30;font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:#9aa3c4}
  #loading.hide{display:none}
  .spinner{width:40px;height:40px;border:2px solid rgba(255,255,255,.1);border-top-color:#ffae00;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- game over ---------- */
  #gameover{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:25}
  #gameover.show{display:flex}
  #gameover h1{font-size:clamp(50px,10vw,140px);font-weight:900;color:#ff3a55;letter-spacing:-.04em;text-shadow:0 0 40px rgba(255,60,80,.6)}
  #gameover p{margin-top:14px;font-size:14px;letter-spacing:.4em;color:#9aa3c4;text-transform:uppercase}
  #gameover button{margin-top:40px;padding:14px 44px;font-size:13px;letter-spacing:.3em;text-transform:uppercase;background:#fff;color:#000;border:none;border-radius:4px;cursor:pointer;font-weight:700}
</style>
</head>
<body>

<div id="loading"><div style="display:flex;flex-direction:column;align-items:center"><div class="spinner"></div>Building Neo City…</div></div>

<div id="start">
  <h1>NEO CITY</h1>
  <div class="sub">Open World · 2099</div>
  <div class="keys">
    <b>WASD</b><span>Move</span>
    <b>Shift</b><span>Sprint</span>
    <b>Space</b><span>Jump</span>
    <b>Mouse</b><span>Look</span>
    <b>Left Click</b><span>Shoot / Punch</span>
    <b>F</b><span>Enter / Exit Vehicle</span>
    <b>R</b><span>Reload</span>
    <b>1 / 2</b><span>Fists / Pistol</span>
    <b>Esc</b><span>Pause</span>
  </div>
  <button id="play">Start</button>
  <div class="tag">Click anywhere to lock the cursor · WebGL required</div>
</div>

<canvas id="game"></canvas>

<div id="hud">
  <div id="stats" class="panel">
    <div class="label"><span>Health</span><b id="hp-num">100</b></div>
    <div class="bar hp"><i id="hp-bar" style="width:100%"></i></div>
    <div class="label" style="margin-top:8px"><span>Armor</span><b id="armor-num">0</b></div>
    <div class="bar armor"><i id="armor-bar" style="width:0%"></i></div>
  </div>

  <div id="money" class="panel">
    <div class="label"><span>Cash</span></div>
    <div class="amount">$<span id="cash">0</span></div>
    <div id="wanted">
      <span data-i="0">★</span><span data-i="1">★</span><span data-i="2">★</span><span data-i="3">★</span><span data-i="4">★</span>
    </div>
  </div>

  <div id="weapon" class="panel">
    <div class="name" id="wname">Fists</div>
    <div class="ammo"><span id="ammo">∞</span><small id="ammax"></small></div>
  </div>

  <div id="minimap" class="panel">
    <div id="compass">N</div>
    <canvas id="map" width="200" height="200"></canvas>
  </div>

  <div id="cross"></div>
  <div id="prompt"><b id="prompt-key">F</b><span id="prompt-msg">Enter Vehicle</span></div>
  <div id="notify"></div>
  <div id="damage"></div>
</div>

<div id="gameover">
  <h1>WASTED</h1>
  <p id="death-cause">You died</p>
  <button id="respawn">Respawn</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
}}
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   NEO CITY — single-file open-world prototype
   ============================================================ */

/* ---------------- Globals ---------------- */
const TWO_PI = Math.PI * 2;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp  = (a,b,t) => a + (b-a)*t;
const rand  = (a=1,b)=> b===undefined ? Math.random()*a : a + Math.random()*(b-a);
const choice = arr => arr[Math.floor(Math.random()*arr.length)];

const KEY = {};
const MOUSE = { dx:0, dy:0, down:false, justDown:false };
addEventListener('keydown', e => { KEY[e.code] = true; if(e.code==='Tab') e.preventDefault(); });
addEventListener('keyup',   e => { KEY[e.code] = false; });
addEventListener('blur', () => { for(const k in KEY) KEY[k]=false; });

const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x90b0d8);
scene.fog = new THREE.Fog(0x90b0d8, 60, 320);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 800);
camera.position.set(0, 8, 16);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------- Lighting / Sky ---------------- */
const hemi = new THREE.HemisphereLight(0xbfd6ff, 0x404030, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1c7, 1.2);
sun.position.set(80,140,40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -120;
sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120;
sun.shadow.camera.bottom = -120;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 400;
sun.shadow.bias = -0.0003;
scene.add(sun);

const ambient = new THREE.AmbientLight(0xffffff, 0.18);
scene.add(ambient);

// big sky dome
{
  const skyGeo = new THREE.SphereGeometry(380, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms:{ uTop:{value:new THREE.Color(0x4a7fcf)}, uBottom:{value:new THREE.Color(0xbfd6ff)}, uSun:{value:new THREE.Vector3(0.5,0.85,0.25)} },
    vertexShader:`varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform vec3 uTop, uBottom, uSun;
      varying vec3 vDir;
      void main(){
        float h = clamp(vDir.y*0.5+0.5, 0.0, 1.0);
        vec3 col = mix(uBottom, uTop, pow(h,0.6));
        float sun = pow(max(dot(vDir, normalize(uSun)),0.0), 220.0);
        col += vec3(1.0,0.85,0.6) * sun * 1.2;
        float halo = pow(max(dot(vDir, normalize(uSun)),0.0), 6.0)*0.18;
        col += vec3(1.0,0.7,0.3)*halo;
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
  // expose for day-night
  scene.userData.skyMat = skyMat;
}

/* ---------------- City Generation ---------------- */
const CITY_BLOCKS = 7;       // per side, total 7x7 city blocks
const BLOCK_SIZE  = 40;       // size of each block (m)
const ROAD_WIDTH  = 8;
const SIDEWALK    = 1.0;
const CITY_HALF   = (CITY_BLOCKS*BLOCK_SIZE)/2;

const colliders = [];        // axis-aligned static rectangles {minX,maxX,minZ,maxZ}
function addCollider(cx, cz, sx, sz){ colliders.push({minX:cx-sx/2,maxX:cx+sx/2,minZ:cz-sz/2,maxZ:cz+sz/2}); }

// instanced building setup
const buildingGeoPool = [];
const windowPattern = (() => {
  // procedural window texture
  const c = document.createElement('canvas'); c.width=128; c.height=256;
  const x = c.getContext('2d');
  x.fillStyle='#1a1f2c'; x.fillRect(0,0,c.width,c.height);
  for(let r=0;r<16;r++){
    for(let cc=0;cc<6;cc++){
      const lit = Math.random()<0.45;
      x.fillStyle = lit ? `rgba(255,${200+Math.random()*55|0},${100+Math.random()*100|0},${0.6+Math.random()*0.4})` : '#1a1f2c';
      x.fillRect(8+cc*20, 6+r*16, 14, 10);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
})();

const groundMat = new THREE.MeshLambertMaterial({ color:0x4d5a3e });
const sidewalkMat = new THREE.MeshLambertMaterial({ color:0x9aa0a6 });
const roadMat = new THREE.MeshLambertMaterial({ color:0x1c1d22 });
const lineMat = new THREE.MeshBasicMaterial({ color:0xf7d24a });

// ground
{
  const g = new THREE.Mesh(new THREE.PlaneGeometry(900,900), groundMat);
  g.rotation.x = -Math.PI/2;
  g.position.y = 0;
  g.receiveShadow = true;
  scene.add(g);
}

// build streets + sidewalks for the whole city
function buildStreets(){
  const totalSize = CITY_BLOCKS * BLOCK_SIZE;
  // road strips: every BLOCK_SIZE there's a road of ROAD_WIDTH
  // we'll lay individual quads along axes
  const roadGroup = new THREE.Group();

  // horizontal roads
  for(let i=0;i<=CITY_BLOCKS;i++){
    const z = -CITY_HALF + i*BLOCK_SIZE;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(totalSize+ROAD_WIDTH*2, ROAD_WIDTH), roadMat);
    m.rotation.x = -Math.PI/2; m.position.set(0, 0.01, z); m.receiveShadow=true;
    roadGroup.add(m);
    // dashed center line
    for(let x=-CITY_HALF; x<CITY_HALF; x+=4){
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(2,0.2), lineMat);
      dash.rotation.x=-Math.PI/2; dash.position.set(x+1, 0.02, z);
      roadGroup.add(dash);
    }
  }
  // vertical roads
  for(let i=0;i<=CITY_BLOCKS;i++){
    const x = -CITY_HALF + i*BLOCK_SIZE;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, totalSize+ROAD_WIDTH*2), roadMat);
    m.rotation.x = -Math.PI/2; m.position.set(x, 0.01, 0); m.receiveShadow=true;
    roadGroup.add(m);
    for(let z=-CITY_HALF; z<CITY_HALF; z+=4){
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.2,2), lineMat);
      dash.rotation.x=-Math.PI/2; dash.position.set(x, 0.02, z+1);
      roadGroup.add(dash);
    }
  }

  scene.add(roadGroup);
}
buildStreets();

// build buildings inside each block
function buildCity(){
  const buildings = new THREE.Group();
  buildings.name = 'buildings';

  for(let bx=0; bx<CITY_BLOCKS; bx++){
    for(let bz=0; bz<CITY_BLOCKS; bz++){
      const cx = -CITY_HALF + bx*BLOCK_SIZE + BLOCK_SIZE/2;
      const cz = -CITY_HALF + bz*BLOCK_SIZE + BLOCK_SIZE/2;
      const inner = BLOCK_SIZE - ROAD_WIDTH - SIDEWALK*2;

      // sidewalk slab
      const sw = new THREE.Mesh(new THREE.BoxGeometry(inner+SIDEWALK*2, 0.2, inner+SIDEWALK*2), sidewalkMat);
      sw.position.set(cx, 0.1, cz); sw.receiveShadow=true;
      buildings.add(sw);

      // sometimes a park instead of buildings
      if(Math.random() < 0.12){
        const grass = new THREE.Mesh(new THREE.BoxGeometry(inner, 0.05, inner), new THREE.MeshLambertMaterial({color:0x4a7c3c}));
        grass.position.set(cx, 0.16, cz); grass.receiveShadow=true;
        buildings.add(grass);
        // trees
        for(let t=0;t<6;t++){
          const tx = cx + rand(-inner/2+1, inner/2-1);
          const tz = cz + rand(-inner/2+1, inner/2-1);
          buildings.add(makeTree(tx,tz));
        }
        continue;
      }

      // grid the inner area into N x N lots
      const gridN = 2 + (Math.random()<0.5?1:0);
      const lot = inner/gridN;
      for(let gx=0; gx<gridN; gx++){
        for(let gz=0; gz<gridN; gz++){
          if(Math.random()<0.06) continue; // empty lot
          const lx = cx - inner/2 + gx*lot + lot/2;
          const lz = cz - inner/2 + gz*lot + lot/2;
          const w = lot*rand(0.6,0.94);
          const d = lot*rand(0.6,0.94);
          const h = rand(8, 50) + (gridN===2?rand(0,30):0);
          const b = makeBuilding(w,h,d);
          b.position.set(lx, h/2, lz);
          b.castShadow=true; b.receiveShadow=true;
          buildings.add(b);
          addCollider(lx, lz, w, d);
        }
      }
    }
  }
  scene.add(buildings);
}

function makeBuilding(w,h,d){
  const tex = windowPattern.clone();
  tex.repeat.set(Math.max(1, Math.round(w/3)), Math.max(2, Math.round(h/4)));
  tex.needsUpdate = true;
  const baseColor = new THREE.Color().setHSL(rand(0.55,0.7), 0.05+Math.random()*0.05, 0.3+Math.random()*0.2);
  const sideMat = new THREE.MeshStandardMaterial({ map: tex, color: baseColor, roughness:0.85, metalness:0.05 });
  const topMat  = new THREE.MeshStandardMaterial({ color: baseColor.clone().multiplyScalar(0.7), roughness:0.95 });
  const mats = [sideMat, sideMat, topMat, topMat, sideMat, sideMat];
  return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mats);
}

function makeTree(x,z){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,2,8), new THREE.MeshLambertMaterial({color:0x6b3f1f}));
  trunk.position.y=1; trunk.castShadow=true; g.add(trunk);
  const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.6,3,7), new THREE.MeshLambertMaterial({color:0x2d6a2d}));
  leaves.position.y=3.2; leaves.castShadow=true; g.add(leaves);
  g.position.set(x,0,z);
  return g;
}

buildCity();

// streetlights at intersections
function buildStreetLights(){
  const grp = new THREE.Group();
  for(let i=0;i<=CITY_BLOCKS;i++){
    for(let j=0;j<=CITY_BLOCKS;j++){
      if(Math.random()<0.4) continue;
      const x = -CITY_HALF + i*BLOCK_SIZE;
      const z = -CITY_HALF + j*BLOCK_SIZE;
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,5,6), new THREE.MeshStandardMaterial({color:0x222428,metalness:0.7,roughness:0.4}));
      post.position.set(x+ROAD_WIDTH/2+0.5, 2.5, z+ROAD_WIDTH/2+0.5); post.castShadow=true;
      grp.add(post);
      const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.25,8,8), new THREE.MeshStandardMaterial({color:0xfff1a8,emissive:0xffd16a,emissiveIntensity:1.2}));
      lamp.position.copy(post.position); lamp.position.y=5; grp.add(lamp);
      lamp.userData.light = true;
    }
  }
  scene.add(grp);
  scene.userData.lamps = grp;
}
buildStreetLights();

/* ---------------- Character Rig ---------------- */
class Character {
  constructor(opts={}){
    const palette = opts.palette || { skin:0xf2c4a0, shirt:0x3060c0, pants:0x222831, hair:0x1a1a1a, shoes:0x111 };
    const root = new THREE.Group();
    this.root = root;
    this.palette = palette;

    const skinMat = new THREE.MeshStandardMaterial({color:palette.skin, roughness:0.85});
    const shirtMat = new THREE.MeshStandardMaterial({color:palette.shirt, roughness:0.7});
    const pantsMat = new THREE.MeshStandardMaterial({color:palette.pants, roughness:0.85});
    const hairMat = new THREE.MeshStandardMaterial({color:palette.hair, roughness:0.95});
    const shoeMat = new THREE.MeshStandardMaterial({color:palette.shoes, roughness:0.6});

    // proportions
    const torsoH = 0.9, torsoW=0.55, torsoD=0.32;
    const hipY = 1.05;

    // pelvis pivot at hipY
    const pelvis = new THREE.Group(); pelvis.position.y = hipY;
    root.add(pelvis);
    this.pelvis = pelvis;

    // torso
    const torso = new THREE.Mesh(new THREE.BoxGeometry(torsoW, torsoH, torsoD), shirtMat);
    torso.position.y = torsoH/2 + 0.05;
    torso.castShadow = true;
    pelvis.add(torso);
    this.torso = torso;

    // neck + head
    const head = new THREE.Group();
    head.position.y = torsoH + 0.18;
    pelvis.add(head);
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.08,0.12,8), skinMat);
    neck.position.y=-0.06; head.add(neck);
    const skull = new THREE.Mesh(new THREE.BoxGeometry(0.34,0.36,0.32), skinMat);
    skull.position.y=0.18; skull.castShadow=true; head.add(skull);
    const hair = new THREE.Mesh(new THREE.BoxGeometry(0.36,0.12,0.34), hairMat);
    hair.position.y=0.34; head.add(hair);
    // eyes (just dark dots)
    const eyeGeo = new THREE.BoxGeometry(0.04,0.03,0.02);
    const eyeMat = new THREE.MeshBasicMaterial({color:0x111});
    const eL = new THREE.Mesh(eyeGeo,eyeMat); eL.position.set(-0.07,0.18,0.165); head.add(eL);
    const eR = new THREE.Mesh(eyeGeo,eyeMat); eR.position.set( 0.07,0.18,0.165); head.add(eR);
    this.head = head;

    // shoulders pivot at top of torso
    const shY = torsoH + 0.02;
    const armW = 0.14, armLen = 0.34;

    const makeArm = side => {
      const shoulder = new THREE.Group();
      shoulder.position.set(side*(torsoW/2 + 0.04), shY, 0);
      pelvis.add(shoulder);
      const upper = new THREE.Mesh(new THREE.BoxGeometry(armW, armLen, armW), shirtMat);
      upper.position.y = -armLen/2;
      upper.castShadow=true;
      shoulder.add(upper);
      const elbow = new THREE.Group();
      elbow.position.y = -armLen;
      shoulder.add(elbow);
      const lower = new THREE.Mesh(new THREE.BoxGeometry(armW*0.9, armLen, armW*0.9), skinMat);
      lower.position.y = -armLen/2;
      lower.castShadow=true;
      elbow.add(lower);
      const hand = new THREE.Mesh(new THREE.BoxGeometry(0.13,0.13,0.13), skinMat);
      hand.position.y = -armLen - 0.08;
      hand.castShadow=true;
      elbow.add(hand);
      return { shoulder, elbow, hand, upper, lower };
    };
    this.armL = makeArm(-1);
    this.armR = makeArm( 1);

    // legs
    const legLen = 0.5;
    const makeLeg = side => {
      const hip = new THREE.Group();
      hip.position.set(side*0.13, 0, 0);
      pelvis.add(hip);
      const upper = new THREE.Mesh(new THREE.BoxGeometry(0.18, legLen, 0.18), pantsMat);
      upper.position.y = -legLen/2;
      upper.castShadow=true;
      hip.add(upper);
      const knee = new THREE.Group();
      knee.position.y = -legLen;
      hip.add(knee);
      const lower = new THREE.Mesh(new THREE.BoxGeometry(0.16, legLen, 0.16), pantsMat);
      lower.position.y = -legLen/2;
      lower.castShadow=true;
      knee.add(lower);
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.1, 0.3), shoeMat);
      foot.position.set(0, -legLen-0.05, 0.05);
      foot.castShadow=true;
      knee.add(foot);
      return { hip, knee, foot };
    };
    this.legL = makeLeg(-1);
    this.legR = makeLeg( 1);

    // weapon node (right hand)
    this.handNode = this.armR.elbow;
    this.weapon = null;

    // state
    this.position = root.position;
    this.velocity = new THREE.Vector3();
    this.heading  = 0;        // y-rotation
    this.speed    = 0;        // forward speed
    this.state    = 'idle';
    this.animTime = 0;
    this.health   = 100;
    this.maxHealth = 100;
    this.alive = true;
    this.radius = 0.4;
    this.height = 1.8;

    // for procedural lookAt
    this.headYaw = 0;
    this.headPitch = 0;
  }

  setHolding(weapon){
    if(this.weapon){ this.handNode.remove(this.weapon); }
    this.weapon = weapon;
    if(weapon){
      this.handNode.add(weapon);
      weapon.position.set(0,-0.42,0.05);
      weapon.rotation.set(0,0,0);
    }
  }

  /* state-driven procedural animation */
  animate(dt){
    this.animTime += dt;
    const t = this.animTime;
    const A = this; // shorthand

    // reset arm/leg pivots base
    const setRot = (g,x,y,z)=>g.rotation.set(x,y,z);
    setRot(A.armL.shoulder, 0,0,0);
    setRot(A.armR.shoulder, 0,0,0);
    setRot(A.armL.elbow, 0,0,0);
    setRot(A.armR.elbow, 0,0,0);
    setRot(A.legL.hip, 0,0,0);
    setRot(A.legR.hip, 0,0,0);
    setRot(A.legL.knee, 0,0,0);
    setRot(A.legR.knee, 0,0,0);

    A.pelvis.position.y = 1.05;
    A.head.rotation.set(this.headPitch, this.headYaw, 0);

    switch(this.state){
      case 'idle': {
        const b = Math.sin(t*1.6)*0.025;
        A.pelvis.position.y = 1.05 + b;
        A.torso.rotation.z = Math.sin(t*1.6)*0.02;
        A.armL.shoulder.rotation.x = Math.sin(t*1.6)*0.05 - 0.05;
        A.armR.shoulder.rotation.x = Math.sin(t*1.6+Math.PI)*0.05 - 0.05;
        A.armL.shoulder.rotation.z = 0.06;
        A.armR.shoulder.rotation.z = -0.06;
        A.armL.elbow.rotation.x = -0.15;
        A.armR.elbow.rotation.x = -0.15;
        break;
      }
      case 'walk':
      case 'run': {
        const speedMul = this.state==='run' ? 2.6 : 1.6;
        const swing    = this.state==='run' ? 1.2 : 0.7;
        const stride   = this.state==='run' ? 1.0 : 0.7;
        const ph = t*speedMul*2.6;
        // legs
        A.legL.hip.rotation.x =  Math.sin(ph)*stride;
        A.legR.hip.rotation.x = -Math.sin(ph)*stride;
        A.legL.knee.rotation.x = Math.max(0, -Math.sin(ph))*0.8;
        A.legR.knee.rotation.x = Math.max(0,  Math.sin(ph))*0.8;
        // arms (counter-swing)
        A.armL.shoulder.rotation.x = -Math.sin(ph)*swing;
        A.armR.shoulder.rotation.x =  Math.sin(ph)*swing;
        A.armL.elbow.rotation.x = -0.5 - Math.max(0, Math.sin(ph))*0.4;
        A.armR.elbow.rotation.x = -0.5 - Math.max(0,-Math.sin(ph))*0.4;
        // body bob
        A.pelvis.position.y = 1.05 + Math.abs(Math.sin(ph))*0.05;
        A.torso.rotation.z = Math.sin(ph)*0.04;
        A.torso.rotation.y = Math.sin(ph)*0.06;
        if(this.state==='run'){
          A.torso.rotation.x = 0.18; // forward lean
        } else {
          A.torso.rotation.x = 0.05;
        }
        break;
      }
      case 'aim': {
        // both hands forward holding pistol
        A.armR.shoulder.rotation.x = -1.55;
        A.armR.shoulder.rotation.y = 0.0;
        A.armR.elbow.rotation.x = -0.1;
        A.armL.shoulder.rotation.x = -1.45;
        A.armL.shoulder.rotation.y = 0.4;
        A.armL.shoulder.rotation.z = -0.2;
        A.armL.elbow.rotation.x = -0.6;
        // breathing sway
        A.torso.rotation.y = Math.sin(t*1.3)*0.02;
        A.pelvis.position.y = 1.05 + Math.sin(t*1.3)*0.01;
        // small recoil
        if(this.recoil>0){
          A.armR.shoulder.rotation.x -= this.recoil*0.6;
          this.recoil *= Math.exp(-dt*8);
        }
        break;
      }
      case 'punch': {
        // alternating quick jab
        const p = clamp(this.actionT/0.25, 0, 1);
        const arm = this.punchHand==='L' ? A.armL : A.armR;
        const back = this.punchHand==='L' ? A.armR : A.armL;
        arm.shoulder.rotation.x = lerp(-0.1, -1.7, Math.sin(p*Math.PI));
        arm.elbow.rotation.x = lerp(-1.4, -0.05, p);
        back.shoulder.rotation.x = -0.2;
        back.elbow.rotation.x = -1.0;
        A.torso.rotation.y = (this.punchHand==='L'?-1:1) * Math.sin(p*Math.PI) * 0.35;
        if(p>=1) this.state='idle';
        this.actionT += dt;
        break;
      }
      case 'hit': {
        const p = clamp(this.actionT/0.4,0,1);
        A.torso.rotation.x = -Math.sin(p*Math.PI)*0.5;
        A.head.rotation.x  = -Math.sin(p*Math.PI)*0.4;
        if(p>=1) this.state='idle';
        this.actionT += dt;
        break;
      }
      case 'drive': {
        // hands on wheel
        A.armL.shoulder.rotation.x = -1.3;
        A.armL.shoulder.rotation.z = -0.5;
        A.armL.elbow.rotation.x = -1.0;
        A.armR.shoulder.rotation.x = -1.3;
        A.armR.shoulder.rotation.z = 0.5;
        A.armR.elbow.rotation.x = -1.0;
        A.legL.hip.rotation.x = 1.3;
        A.legR.hip.rotation.x = 1.3;
        A.legL.knee.rotation.x = 1.3;
        A.legR.knee.rotation.x = 1.3;
        break;
      }
      case 'die': {
        const p = clamp(this.actionT/1.0, 0, 1);
        A.pelvis.rotation.z = lerp(0, Math.PI/2, p);
        A.pelvis.position.y = lerp(1.05, 0.1, p);
        this.actionT += dt;
        break;
      }
    }

    // smooth heading -> root rotation
    this.root.rotation.y = this.heading;
  }
}

/* ---------------- Vehicles ---------------- */
class Vehicle {
  constructor(opts={}){
    const root = new THREE.Group();
    this.root = root;

    const bodyColor = opts.color ?? choice([0xc23232,0x2858c2,0x1a1a1a,0xd4a02a,0x2da34a,0xe6e6e6,0x6a6a6a,0xff6a00]);
    const bodyMat = new THREE.MeshStandardMaterial({color:bodyColor, metalness:0.6, roughness:0.35});
    const glassMat = new THREE.MeshStandardMaterial({color:0x102030, metalness:0.2, roughness:0.1, transparent:true, opacity:0.55});
    const tireMat  = new THREE.MeshStandardMaterial({color:0x111, roughness:0.9});
    const trimMat  = new THREE.MeshStandardMaterial({color:0x222, metalness:0.6, roughness:0.4});

    // chassis
    const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.45, 4.4), bodyMat);
    chassis.position.y = 0.55; chassis.castShadow=true;
    root.add(chassis);
    // hood/trunk slope: simple
    const hood = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.2, 1.4), bodyMat);
    hood.position.set(0,0.86,1.4); hood.castShadow=true;
    root.add(hood);
    const trunk = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.2, 1.0), bodyMat);
    trunk.position.set(0,0.86,-1.6); trunk.castShadow=true;
    root.add(trunk);
    // cabin
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 2.0), bodyMat);
    cabin.position.set(0,1.15,0); cabin.castShadow=true;
    root.add(cabin);
    // windows
    const wF = new THREE.Mesh(new THREE.BoxGeometry(1.7,0.6,0.05), glassMat); wF.position.set(0,1.18,1.0); root.add(wF);
    const wB = new THREE.Mesh(new THREE.BoxGeometry(1.7,0.6,0.05), glassMat); wB.position.set(0,1.18,-1.0); root.add(wB);
    const wL = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.5,1.85), glassMat); wL.position.set(-0.91,1.2,0); root.add(wL);
    const wR = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.5,1.85), glassMat); wR.position.set( 0.91,1.2,0); root.add(wR);
    // headlights / taillights
    const hl1 = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.12,0.08), new THREE.MeshStandardMaterial({color:0xffe8a8, emissive:0xffd070, emissiveIntensity:0.8}));
    hl1.position.set(-0.7,0.7,2.21); root.add(hl1);
    const hl2 = hl1.clone(); hl2.position.x=0.7; root.add(hl2);
    const tl1 = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.12,0.08), new THREE.MeshStandardMaterial({color:0xff3030, emissive:0xff1010, emissiveIntensity:0.8}));
    tl1.position.set(-0.7,0.7,-2.21); root.add(tl1);
    const tl2 = tl1.clone(); tl2.position.x=0.7; root.add(tl2);
    // wheels
    const wheelGeo = new THREE.CylinderGeometry(0.42,0.42,0.32,18);
    const wheels = [];
    [[-0.95,0.42,1.45],[0.95,0.42,1.45],[-0.95,0.42,-1.45],[0.95,0.42,-1.45]].forEach(p=>{
      const w = new THREE.Mesh(wheelGeo, tireMat);
      w.rotation.z = Math.PI/2;
      w.position.set(...p);
      w.castShadow=true;
      // hub
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.34,8), trimMat);
      hub.rotation.z = Math.PI/2;
      hub.position.copy(w.position);
      root.add(w); root.add(hub);
      w.userData.hub = hub;
      wheels.push(w);
    });
    this.wheels = wheels;

    this.position = root.position;
    this.heading  = 0;
    this.speed    = 0;       // forward speed
    this.steerAngle = 0;
    this.maxSpeed = 22;
    this.accel = 12;
    this.brake = 18;
    this.driver = null;       // Character occupying it
    this.health = 200;
    this.alive = true;
    this.length = 4.4;
    this.width  = 2.0;
    this.bodyColor = bodyColor;
  }
  setHeading(h){ this.heading = h; this.root.rotation.y = h; }
  update(dt){
    if(!this.alive){
      this.root.position.y = lerp(this.root.position.y, 0.2, dt*2);
      return;
    }
    // wheel spin
    const ws = this.speed * dt / 0.42;
    for(let i=0;i<this.wheels.length;i++){
      const w = this.wheels[i];
      w.rotation.x += ws;
      // front wheels steer
      if(i<2){ w.rotation.y = this.steerAngle*0.8; w.userData.hub.rotation.y = this.steerAngle*0.8; }
    }
    // bike-like steering kinematics
    const dir = new THREE.Vector3(Math.sin(this.heading), 0, Math.cos(this.heading));
    const newPos = this.position.clone().addScaledVector(dir, this.speed*dt);
    // car length steering
    if(Math.abs(this.speed) > 0.05){
      this.heading += (this.speed*dt) * Math.tan(this.steerAngle) / this.length * 0.9;
    }
    // collide with city
    const blocked = collidesPoint(newPos.x, newPos.z, 1.0);
    if(blocked){
      // bounce / slow down on impact
      this.speed *= 0.35;
      // small offset: try X-only then Z-only
      const tryX = collidesPoint(newPos.x, this.position.z, 1.0) ? this.position.x : newPos.x;
      const tryZ = collidesPoint(this.position.x, newPos.z, 1.0) ? this.position.z : newPos.z;
      this.position.set(tryX, this.position.y, tryZ);
    } else {
      this.position.copy(newPos);
    }
    this.root.rotation.y = this.heading;

    // friction
    this.speed *= (1 - 0.35*dt);
    // engine sound bob
    const bob = Math.sin(performance.now()*0.02)*0.005*Math.min(1, Math.abs(this.speed)/8);
    this.root.position.y = bob;
  }
}

const vehicles = [];
function spawnVehicles(n=22){

  for(let i=0;i<n;i++){

    const horiz = Math.random()<0.5;
    const blockI = Math.floor(rand(0, CITY_BLOCKS+1));

    let x,z,h;
    if(horiz){
      const z0 = -CITY_HALF + blockI*BLOCK_SIZE;
      x = along; z = z0 + (Math.random()<0.5?-2.2:2.2);
      h = Math.random()<0.5?0:Math.PI;
    } else {
      const x0 = -CITY_HALF + blockI*BLOCK_SIZE;

      h = Math.random()<0.5?Math.PI/2:-Math.PI/2;
    }
    v.position.set(x, 0, z);
    v.setHeading(h);
    scene.add(v.root);
    vehicles.push(v);
  }
}

/* ---------------- Collision helpers ---------------- */
function collidesPoint(x,z, pad=0.3){
  for(let i=0;i<colliders.length;i++){
    const c = colliders[i];
    if(x > c.minX-pad && x < c.maxX+pad && z > c.minZ-pad && z < c.maxZ+pad) return c;
  }
  return null;
}
function resolveMove(curX, curZ, nx, nz, pad=0.3){
  if(!collidesPoint(nx, nz, pad)) return [nx, nz];
  if(!collidesPoint(nx, curZ, pad)) return [nx, curZ];
  if(!collidesPoint(curX, nz, pad)) return [curX, nz];
  return [curX, curZ];
}

/* minimap */
function drawMinimap(){
  const w = mapCanvas.width, h = mapCanvas.height;
  mapCtx.save();
  mapCtx.fillStyle = '#0c1018'; mapCtx.fillRect(0,0,w,h);
  // map area shows ~120m around player
  const range = 120;
  const cx = w/2, cy = h/2;
  const px = player.position.x, pz = player.position.z;
  // rotate so north is up but rotate by -player heading? We'll keep north=up
  // draw roads (just lines)
  mapCtx.strokeStyle = '#3a4050';
  mapCtx.lineWidth = 6;
  for(let i=0;i<=CITY_BLOCKS;i++){
    const z = -CITY_HALF + i*BLOCK_SIZE;
    const sy = (z - pz) / range * (h/2) + cy;
    if(sy<-10||sy>h+10) continue;
    mapCtx.beginPath(); mapCtx.moveTo(0,sy); mapCtx.lineTo(w,sy); mapCtx.stroke();
    const x = -CITY_HALF + i*BLOCK_SIZE;
    const sx = (x - px) / range * (w/2) + cx;
    if(sx<-10||sx>w+10) continue;
    mapCtx.beginPath(); mapCtx.moveTo(sx,0); mapCtx.lineTo(sx,h); mapCtx.stroke();
  }
  // buildings dots (skip — too many)
  // vehicles
  vehicles.forEach(v=>{
    const sx = (v.position.x - px)/range * (w/2) + cx;
    const sy = (v.position.z - pz)/range * (h/2) + cy;
    if(sx<2||sx>w-2||sy<2||sy>h-2) return;
    mapCtx.fillStyle = v.alive ? '#'+v.bodyColor.toString(16).padStart(6,'0') : '#444';
    mapCtx.fillRect(sx-2, sy-2, 4, 4);
  });
  // npcs
  npcs.forEach(n=>{
    if(!n.alive) return;
    const sx = (n.root.position.x - px)/range*(w/2)+cx;
    const sy = (n.root.position.z - pz)/range*(h/2)+cy;
    if(sx<2||sx>w-2||sy<2||sy>h-2) return;
    mapCtx.fillStyle = n.kind==='cop' ? '#3aa0ff' : '#9aa3c4';
    mapCtx.beginPath(); mapCtx.arc(sx,sy,2,0,TWO_PI); mapCtx.fill();
  });
  // player
  mapCtx.save();
  mapCtx.translate(cx, cy);
  mapCtx.rotate(-player.heading);
  mapCtx.fillStyle = '#ffd24a';
  mapCtx.beginPath();
  mapCtx.moveTo(0,-7); mapCtx.lineTo(5,5); mapCtx.lineTo(0,2); mapCtx.lineTo(-5,5); mapCtx.closePath();
  mapCtx.fill();
  mapCtx.restore();
  mapCtx.restore();

  // compass label
  // get compass direction from yaw
  const deg = (-yaw * 180/Math.PI) % 360;
  const dirs=['N','NE','E','SE','S','SW','W','NW'];
  const idx = Math.round(((deg+360)%360)/45) % 8;
  compassEl.textContent = dirs[idx];
}

/* ---------------- Damage / Death ---------------- */
function damagePlayer(amount, cause='You died'){
  if(!player.alive) return;
  // armor absorbs 60%
  if(player.armor>0){
    const a = Math.min(player.armor, amount*0.6);
    player.armor -= a;
    amount -= a;
  }
  player.health -= amount;
  damageEl.classList.add('hit');
  setTimeout(()=>damageEl.classList.remove('hit'), 150);
  if(player.health <= 0){
    player.health = 0;
    player.alive = false;
    player.state = 'die';
    player.actionT = 0;
    if(player.inVehicle){ exitVehicle(true); }
    deathCauseEl.textContent = cause;
    setTimeout(()=>gameoverEl.classList.add('show'), 1200);
  }
}

document.getElementById('respawn').addEventListener('click', ()=>{
  // reset
  player.alive = true;
  player.health = player.maxHealth;
  player.armor = 0;
  player.wanted = 0;
  player.cash = Math.floor(player.cash * 0.8);
  player.root.position.set(0,0,0);
  player.pelvis.rotation.set(0,0,0);
  player.state = 'idle';
  gameoverEl.classList.remove('show');
  // remove cops
  for(let i=npcs.length-1;i>=0;i--){
    if(npcs[i].kind==='cop'){
      scene.remove(npcs[i].root);
      npcs.splice(i,1);
    }
  }
  document.body.requestPointerLock?.();
  canvas.requestPointerLock();
});

/* ---------------- Vehicle Entry ---------------- */
let nearestVehicle = null;
function findNearestVehicle(){
  let best = null, bd = 4*4;
  for(const v of vehicles){
    if(!v.alive) continue;
    const dx = v.position.x - player.position.x;
    const dz = v.position.z - player.position.z;
    const d2 = dx*dx + dz*dz;
    if(d2 < bd){ bd = d2; best = v; }
  }
  return best;
}

function enterVehicle(v){
  player.inVehicle = v;
  v.driver = player;
  player.state = 'drive';
  player.root.visible = false; // hidden inside; we keep simple
  notify('Entered '+( '#'+v.bodyColor.toString(16).padStart(6,'0') )+' vehicle');
  // remember the player chose to steal — wanted level if owner near?
  // Simple: increase wanted slightly when stealing
  if(v.userData?.justStolen!==false){ // first time
    addWanted(1);
    v.userData = v.userData||{}; v.userData.justStolen = false;
  }
}
function exitVehicle(forced=false){
  const v = player.inVehicle; if(!v) return;
  v.driver = null;
  player.inVehicle = null;
  player.root.visible = true;
  // step out to the side
  const side = new THREE.Vector3(Math.cos(v.heading), 0, -Math.sin(v.heading));
  player.root.position.copy(v.position).addScaledVector(side, 1.6);
  player.root.position.y = 0;
  player.heading = v.heading;
  player.state = 'idle';
  if(!forced) notify('Exited vehicle');
}

/* ---------------- Wanted system ---------------- */
function addWanted(n){
  player.wanted = clamp(player.wanted + n, 0, 5);
  player.wantedDecay = 0;
}

let copSpawnTimer = 0;
function tickWanted(dt){
  if(player.wanted>0){
    player.wantedDecay += dt;
    // decay slowly when not aggressive
    if(player.wantedDecay > 25){ player.wanted = clamp(player.wanted-1, 0, 5); player.wantedDecay = 0; }
  }
  copSpawnTimer -= dt;
  const aliveCops = npcs.filter(n=>n.kind==='cop' && n.alive).length;
  const desired = player.wanted * 2;
  if(aliveCops < desired && copSpawnTimer<=0){
    spawnCop(player.position);
    copSpawnTimer = 4 - player.wanted*0.5;
  }
}

/* ---------------- Game Logic ---------------- */
function pickupAround(){
  // collect cash dropped from npcs
  for(let i=pickups.length-1;i>=0;i--){
    const p = pickups[i];
    p.bob += 0.06;
    p.mesh.position.y = p.baseY + Math.sin(p.bob)*0.15;
    p.mesh.rotation.y += 0.05;
    const dx = p.mesh.position.x - player.position.x;
    const dz = p.mesh.position.z - player.position.z;
    if(dx*dx+dz*dz < 1.4*1.4){
      player.cash += p.amount;
      notify('+$'+p.amount);
      scene.remove(p.mesh);
      pickups.splice(i,1);
    }
  }
}
const pickups = [];
function dropCash(pos, amount){
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.05,0.2), new THREE.MeshStandardMaterial({color:0x6acf80,emissive:0x113311,emissiveIntensity:0.3}));
  m.position.copy(pos); m.position.y = 0.4; m.castShadow=true;
  scene.add(m);
  pickups.push({mesh:m, amount, baseY:0.4, bob:Math.random()*TWO_PI});
}

/* ---------------- Player Update ---------------- */
function tickPlayer(dt){
  if(!player.alive){ player.animate(dt); return; }

  // mouse look
  yaw   -= MOUSE.dx * 0.0025;
  pitch -= MOUSE.dy * 0.0025;
  pitch = clamp(pitch, -0.9, 0.7);
  MOUSE.dx = 0; MOUSE.dy = 0;

  // weapon switching
  if(KEY['Digit1']){ player.activeWeapon='fists'; player.setHolding(null); }
  if(KEY['Digit2']){ player.activeWeapon='pistol'; player.setHolding(pistolMesh); }

  if(KEY['KeyR'] && player.activeWeapon==='pistol'){
    const w = player.weapons.pistol;
    const need = w.max - w.ammo;
    const take = Math.min(need, w.reserve);
    if(take>0){ w.ammo += take; w.reserve -= take; notify('Reloaded'); }
  }

  // interaction
  if(!player.inVehicle){
    nearestVehicle = findNearestVehicle();
    if(nearestVehicle){
      promptEl.classList.add('show');
      promptKey.textContent='F';
      promptMsg.textContent = nearestVehicle.alive ? 'Enter Vehicle' : 'Vehicle Destroyed';
    } else {
      promptEl.classList.remove('show');
    }
  } else {
    promptEl.classList.add('show');
    promptKey.textContent='F';
    promptMsg.textContent = 'Exit Vehicle';
  }

  if(KEY['KeyF'] && !player._fLast){
    if(player.inVehicle){ exitVehicle(); }
    else if(nearestVehicle && nearestVehicle.alive){ enterVehicle(nearestVehicle); }
  }
  player._fLast = KEY['KeyF'];

  if(player.inVehicle){
    // drive
    const v = player.inVehicle;
    const fwd = (KEY['KeyW']||KEY['ArrowUp'])?1:0;
    const back= (KEY['KeyS']||KEY['ArrowDown'])?1:0;
    const left= (KEY['KeyA']||KEY['ArrowLeft'])?1:0;
    const right=(KEY['KeyD']||KEY['ArrowRight'])?1:0;
    if(fwd) v.speed += v.accel*dt;
    if(back) v.speed -= v.brake*dt;
    if(!fwd && !back) v.speed *= (1-dt*0.6);
    v.speed = clamp(v.speed, -v.maxSpeed*0.4, v.maxSpeed);
    v.steerAngle = lerp(v.steerAngle, (left?0.5:0)-(right?0.5:0), dt*8);
    v.update(dt);
    player.position.copy(v.position);
    player.heading = v.heading;
    player.state = 'drive';
    player.animate(dt);

    // collide with NPCs (ouch)
    for(const n of npcs){
      if(!n.alive) continue;
      const dx = n.root.position.x - v.position.x;
      const dz = n.root.position.z - v.position.z;
      if(dx*dx+dz*dz < 1.4*1.4 && Math.abs(v.speed) > 4){
        n.health -= Math.abs(v.speed)*4;
        spawnSparkBurst(n.root.position.clone().setY(1.0), 0xcc2233, 8);
        if(n.health<=0){ killNPC(n, true); addWanted(1); }
      }
    }

  } else {
    // on-foot movement
    const move = new THREE.Vector3();
    if(KEY['KeyW']||KEY['ArrowUp'])    move.z -= 1;
    if(KEY['KeyS']||KEY['ArrowDown'])  move.z += 1;
    if(KEY['KeyA']||KEY['ArrowLeft'])  move.x -= 1;
    if(KEY['KeyD']||KEY['ArrowRight']) move.x += 1;

    const sprint = !!KEY['ShiftLeft']||!!KEY['ShiftRight'];
    const speed = sprint ? 7.5 : 4.0;

    if(move.lengthSq() > 0){
      move.normalize();
      // rotate by yaw
      const cs = Math.cos(yaw), sn = Math.sin(yaw);
      const wx =  move.x*cs - move.z*sn;
      const wz =  move.x*sn + move.z*cs;
      const dx = wx * speed * dt;
      const dz = wz * speed * dt;
      const [nx,nz] = resolveMove(player.position.x, player.position.z, player.position.x+dx, player.position.z+dz, player.radius);
      player.position.x = nx; player.position.z = nz;
      // face movement direction
      const wantHeading = Math.atan2(wx, wz);
      let dh = ((wantHeading - player.heading + Math.PI*3) % (TWO_PI)) - Math.PI;
      player.heading += dh * Math.min(1, dt*12);
      player.state = sprint ? 'run' : 'walk';
    } else if(MOUSE.down && player.activeWeapon==='pistol'){
      player.state = 'aim';
      // face camera direction
      let dh = ((yaw - player.heading + Math.PI*3) % (TWO_PI)) - Math.PI;
      player.heading += dh * Math.min(1, dt*16);
    } else {
      // idle (or aim if we're holding pistol with right click? we'll keep simple)
      if(player.state !== 'punch' && player.state !== 'hit') player.state = 'idle';
    }

    // jump (small hop, no real physics)
    if(KEY['Space'] && !player.jumping){
      player.jumping = true; player.jumpV = 5.5;
    }
    if(player.jumping){
      player.root.position.y += player.jumpV*dt;
      player.jumpV -= 14*dt;
      if(player.root.position.y <= 0){ player.root.position.y = 0; player.jumping=false; }
    }

    // Combat
    player.shootCooldown -= dt;
    if(MOUSE.down && player.shootCooldown<=0){
      const w = player.weapons[player.activeWeapon];
      if(player.activeWeapon==='pistol'){
        if(w.ammo>0){
          w.ammo--;
          player.shootCooldown = w.rate;
          player.recoil = 1;
          player.state = 'aim';
          fireBulletFromPlayer(w.dmg);
        } else {
          // empty click
          if(MOUSE.justDown) notify('Out of ammo — press R');
        }
      } else {
        // fists
        player.shootCooldown = w.rate;
        player.state='punch'; player.actionT=0;
        player.punchHand = player.punchHand==='L' ? 'R' : 'L';
        // melee hit detection
        const fx = Math.sin(player.heading), fz = Math.cos(player.heading);
        for(const n of npcs){
          if(!n.alive) continue;
          const dx = n.root.position.x - player.position.x;
          const dz = n.root.position.z - player.position.z;
          const d2 = dx*dx+dz*dz;
          if(d2<2.0*2.0){
            const dot = (dx*fx+dz*fz)/Math.sqrt(d2+0.0001);
            if(dot>0.5){
              n.health -= w.dmg;
              n.state='hit'; n.actionT=0;
              spawnSparkBurst(n.root.position.clone().setY(1.4), 0xff5544, 6);
              if(n.health<=0){ killNPC(n, false); addWanted(1); }
              else { n.fleeing = true; n.alertTimer = 6; if(n.kind==='cop'){ addWanted(1); } }
              break;
            }
          }
        }
      }
    }
    player.animate(dt);
  }
  MOUSE.justDown = false;
}

function fireBulletFromPlayer(dmg){
  // origin: muzzle world pos (or just hand)
  const muzzleWorld = new THREE.Vector3();
  if(pistolMesh.userData?.muzzle){
    pistolMesh.userData.muzzle.getWorldPosition(muzzleWorld);
  } else {
    muzzleWorld.copy(player.position).setY(1.45);
  }
  // direction from camera (so it hits what crosshair shows)
  const dir = new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ')).normalize();
  spawnBullet(muzzleWorld, dir, 'player', dmg);
  spawnMuzzleFlash(muzzleWorld);
}

function killNPC(n, isVehicleKill){
  n.alive = false;
  n.state = 'die'; n.actionT = 0;
  // drop cash
  dropCash(n.root.position.clone(), 20+Math.floor(rand(0,80)));
  if(isVehicleKill){ spawnSparkBurst(n.root.position.clone().setY(1), 0xaa2222, 12); }
}

/* ---------------- NPC AI ---------------- */
function tickNPCs(dt){
  for(const n of npcs){
    n.fireTimer = Math.max(0, n.fireTimer - dt);
    if(!n.alive){ n.animate(dt); continue; }
    n.thinkTimer -= dt;
    const distToPlayer = Math.hypot(n.root.position.x - player.position.x, n.root.position.z - player.position.z);
    const sees = distToPlayer < 26;

    if(n.kind==='cop' && player.alive){
      // chase player and shoot
      n.target.copy(player.position);
      const dx = n.target.x - n.root.position.x;
      const dz = n.target.z - n.root.position.z;
      const d  = Math.hypot(dx,dz);
      const wantHeading = Math.atan2(dx, dz);
      let dh = ((wantHeading - n.heading + Math.PI*3) % TWO_PI) - Math.PI;
      n.heading += dh * Math.min(1, dt*6);
      const speed = d>8 ? 5 : 1.5;
      const nx = n.root.position.x + Math.sin(n.heading)*speed*dt;
      const nz = n.root.position.z + Math.cos(n.heading)*speed*dt;
      const [rx,rz] = resolveMove(n.root.position.x, n.root.position.z, nx, nz, n.radius);
      n.root.position.x = rx; n.root.position.z = rz;
      n.state = speed>3 ? 'run' : 'walk';
      // shoot
      if(d<22 && n.fireTimer<=0 && Math.abs(dh)<0.6){
        n.fireTimer = 0.7+Math.random()*0.5;
        const muzzle = n.root.position.clone(); muzzle.y = 1.4;
        const fwd = new THREE.Vector3(Math.sin(n.heading),0,Math.cos(n.heading));
        muzzle.addScaledVector(fwd,0.6);
        const aimDir = new THREE.Vector3(player.position.x-muzzle.x, 1.4-muzzle.y, player.position.z-muzzle.z).normalize();
        // small inaccuracy
        aimDir.x += rand(-0.06,0.06); aimDir.y += rand(-0.04,0.04); aimDir.z += rand(-0.06,0.06);
        spawnBullet(muzzle, aimDir, 'cop', 8);
        spawnMuzzleFlash(muzzle);
      }
    } else {
      // civ
      if(n.fleeing){
        n.alertTimer -= dt;
        if(n.alertTimer<=0){ n.fleeing=false; }
        // run away from player
        const dx = n.root.position.x - player.position.x;
        const dz = n.root.position.z - player.position.z;
        const wantHeading = Math.atan2(dx, dz);
        let dh = ((wantHeading - n.heading + Math.PI*3) % TWO_PI) - Math.PI;
        n.heading += dh * Math.min(1, dt*6);
        const speed = 6;
        const nx = n.root.position.x + Math.sin(n.heading)*speed*dt;
        const nz = n.root.position.z + Math.cos(n.heading)*speed*dt;
        const [rx,rz] = resolveMove(n.root.position.x, n.root.position.z, nx, nz, n.radius);
        n.root.position.x = rx; n.root.position.z = rz;
        n.state = 'run';
      } else {
        // wander
        if(n.thinkTimer<=0 || Math.hypot(n.target.x-n.root.position.x, n.target.z-n.root.position.z)<1.5){
          n.thinkTimer = 4+Math.random()*4;
          n.target.set(n.root.position.x + rand(-15,15), 0, n.root.position.z + rand(-15,15));
          n.target.x = clamp(n.target.x, -CITY_HALF+3, CITY_HALF-3);
          n.target.z = clamp(n.target.z, -CITY_HALF+3, CITY_HALF-3);
        }
        const dx = n.target.x - n.root.position.x;
        const dz = n.target.z - n.root.position.z;
        const d  = Math.hypot(dx,dz);
        if(d>0.05){
          const wantHeading = Math.atan2(dx, dz);
          let dh = ((wantHeading - n.heading + Math.PI*3) % TWO_PI) - Math.PI;
          n.heading += dh * Math.min(1, dt*4);
          const speed = 1.5;
          const nx = n.root.position.x + Math.sin(n.heading)*speed*dt;
          const nz = n.root.position.z + Math.cos(n.heading)*speed*dt;
          const [rx,rz] = resolveMove(n.root.position.x, n.root.position.z, nx, nz, n.radius);
          if(rx===n.root.position.x && rz===n.root.position.z){
            n.thinkTimer = 0; // pick new target
          }
          n.root.position.x = rx; n.root.position.z = rz;
          n.state = 'walk';
        } else {
          n.state = 'idle';
        }
      }
    }
    n.animate(dt);
  }

  // cleanup very-dead bodies far away (keep recent)
  for(let i=npcs.length-1;i>=0;i--){
    const n = npcs[i];
    if(!n.alive){
      n.deathTime = (n.deathTime||0) + dt;
      if(n.deathTime > 30){
        scene.remove(n.root);
        npcs.splice(i,1);
      }
    }
  }
}

/* ---------------- Bullet update ---------------- */
function tickBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    const prev = b.mesh.position.clone();
    b.mesh.position.addScaledVector(b.dir, b.speed*dt);
    b.life -= dt;
    // update trail
    const pos = b.trail.geometry.attributes.position;
    pos.array[0] = prev.x; pos.array[1] = prev.y; pos.array[2] = prev.z;
    pos.array[3] = b.mesh.position.x; pos.array[4] = b.mesh.position.y; pos.array[5] = b.mesh.position.z;
    pos.needsUpdate = true;

    let hit = false;
    // building collision
    if(collidesPoint(b.mesh.position.x, b.mesh.position.z, 0)){ hit = true; spawnSparkBurst(b.mesh.position, 0xcccccc, 4); }
    if(b.mesh.position.y < 0){ hit=true; spawnSparkBurst(b.mesh.position, 0x888888, 4); }

    // hit npcs
    if(!hit) for(const n of npcs){
      if(!n.alive) continue;
      if(b.owner==='cop' && n.kind==='cop') continue;
      const dx = n.root.position.x - b.mesh.position.x;
      const dz = n.root.position.z - b.mesh.position.z;
      const dy = (n.root.position.y+1.0) - b.mesh.position.y;
      if(dx*dx+dz*dz < 0.4*0.4 && Math.abs(dy)<1.1){
        n.health -= b.dmg; n.state='hit'; n.actionT=0;
        spawnSparkBurst(b.mesh.position, 0xaa2233, 6);
        if(n.health<=0){ killNPC(n,false); if(b.owner==='player') addWanted(1); }
        else { n.fleeing=true; n.alertTimer=8; if(n.kind==='cop') addWanted(1); }
        hit = true;
        break;
      }
    }
    // hit player
    if(!hit && b.owner!=='player'){
      const dx = player.position.x - b.mesh.position.x;
      const dz = player.position.z - b.mesh.position.z;
      const dy = (player.position.y+1.0) - b.mesh.position.y;
      if(dx*dx+dz*dz < 0.5*0.5 && Math.abs(dy)<1.1){
        damagePlayer(b.dmg, 'Killed by police');
        spawnSparkBurst(b.mesh.position, 0xff5566, 6);
        hit = true;
      }
    }
    // hit vehicle
    if(!hit) for(const v of vehicles){
      if(!v.alive) continue;
      const dx = v.position.x - b.mesh.position.x;
      const dz = v.position.z - b.mesh.position.z;
      if(dx*dx+dz*dz < 1.6*1.6 && b.mesh.position.y<2.0){
        v.health -= b.dmg;
        spawnSparkBurst(b.mesh.position, 0xffaa44, 4);
        if(v.health<=0){
          v.alive = false;
          spawnExplosion(v.position.clone().setY(1.0));
          if(v.driver){ damagePlayer(50, 'Killed in explosion'); }
          if(b.owner==='player') addWanted(2);
        }
        hit = true;
        break;
      }
    }

    if(hit || b.life<=0){
      scene.remove(b.mesh); scene.remove(b.trail);
      bullets.splice(i,1);
    }
  }
}

function tickParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.vel.y += (p.gravity||0)*dt;
    if(p.fade){
      const k = p.life/p.max;
      p.mesh.material.opacity = clamp(k,0,1);
      if(p.scaleEnd){
        const s = lerp(1, p.scaleEnd, 1-k);
        p.mesh.scale.set(s,s,s);
      }
    }
    if(p.life<=0){ scene.remove(p.mesh); particles.splice(i,1); }
  }
}

/* ---------------- Camera ---------------- */
function tickCamera(dt){
  // target offset based on yaw/pitch behind player
  const camX = Math.sin(yaw) * Math.cos(pitch);
  const camY = Math.sin(pitch);
  const camZ = Math.cos(yaw) * Math.cos(pitch);
  const focus = new THREE.Vector3(player.position.x, player.position.y+1.6, player.position.z);
  if(player.inVehicle){
    focus.set(player.inVehicle.position.x, player.inVehicle.position.y+1.6, player.inVehicle.position.z);
    cameraDistance = lerp(cameraDistance, 8.5, dt*4);
    cameraHeight = lerp(cameraHeight, 3.4, dt*4);
  } else {
    cameraDistance = lerp(cameraDistance, 5.5, dt*4);
    cameraHeight = lerp(cameraHeight, 2.4, dt*4);
  }
  const desired = focus.clone();
  desired.x += camX * cameraDistance;
  desired.y += cameraHeight + camY * cameraDistance * 0.5;
  desired.z += camZ * cameraDistance;

  // collision: pull camera in if it would clip a building
  let dist = cameraDistance;
  if(collidesPoint(desired.x, desired.z, 0.3)){
    // step inwards
    for(let s=0.9; s>0.2; s-=0.1){
      const tx = focus.x + camX*cameraDistance*s;
      const tz = focus.z + camZ*cameraDistance*s;
      if(!collidesPoint(tx, tz, 0.3)){
        desired.x = tx; desired.z = tz; dist = cameraDistance*s; break;
      }
    }
  }

  camera.position.lerp(desired, 1 - Math.pow(0.001, dt));
  camera.lookAt(focus);
}

/* ---------------- Day / Night ---------------- */
let timeOfDay = 0.35;
function tickDayNight(dt){
  timeOfDay += dt * 0.005;        // very slow
  if(timeOfDay>1) timeOfDay-=1;
  const a = Math.sin(timeOfDay*Math.PI*2)*0.5+0.5;  // 0=night, 1=day
  // sun position
  const sunAng = timeOfDay*Math.PI*2;
  sun.position.set(Math.cos(sunAng)*150, Math.sin(sunAng)*120+10, 60);
  sun.intensity = clamp(a*1.4, 0.05, 1.4);
  hemi.intensity = 0.25 + a*0.4;
  ambient.intensity = 0.15+a*0.15;
  // sky colors
  const top = new THREE.Color().setHSL(0.6, 0.6, lerp(0.05,0.5,a));
  const bot = new THREE.Color().setHSL(0.55, 0.4, lerp(0.05, 0.85, a));
  scene.userData.skyMat.uniforms.uTop.value.copy(top);
  scene.userData.skyMat.uniforms.uBottom.value.copy(bot);
  scene.userData.skyMat.uniforms.uSun.value.copy(sun.position).normalize();
  // fog tint
  const fogCol = bot.clone().lerp(new THREE.Color(0x0a0e1a), 1-a);
  scene.fog.color.copy(fogCol);
  scene.background = fogCol;
}

/* ---------------- Game Loop ---------------- */
const clock = new THREE.Clock();
let started = false;
let lastNotifyMsg = '';

function loop(){
  const dt = Math.min(0.05, clock.getDelta());
  if(!paused && started){
    tickPlayer(dt);
    tickNPCs(dt);
    tickBullets(dt);
    tickParticles(dt);
    pickupAround();
    vehicles.forEach(v=>{
      if(v !== player.inVehicle) v.update(dt);
    });
    tickWanted(dt);
    tickDayNight(dt);
    tickCamera(dt);
    if(notifyTimer>0){ notifyTimer-=dt; if(notifyTimer<=0) notifyEl.classList.remove('show'); }
    drawMinimap();
    updateHUD();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* ---------------- Boot ---------------- */
function startGame(){
  started = true;
  document.getElementById('start').style.display='none';
  document.getElementById('loading').classList.add('hide');
  canvas.requestPointerLock();
  notify('Welcome to Neo City');
}

document.getElementById('play').addEventListener('click', () => {
  startGame();
});

// Hide loader after init
setTimeout(()=>document.getElementById('loading').classList.add('hide'), 200);

// Click anywhere on canvas to re-lock pointer
canvas.addEventListener('click', ()=>{
  if(started && document.pointerLockElement!==canvas){
    canvas.requestPointerLock();
  }
});

// initial render so user sees the scene behind the start menu
loop();
</script>
